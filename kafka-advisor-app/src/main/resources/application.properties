quarkus.langchain4j.openai.base-url=http://localhost:8080/v1
quarkus.langchain4j.openai.api-key=none
quarkus.langchain4j.openai.timeout=120s
quarkus.langchain4j.openai.log-requests=true
quarkus.langchain4j.openai.log-responses=true
quarkus.langchain4j.openai.chat-model.model-name=llama32-3b-instruct-fp8
quarkus.langchain4j.openai.chat-model.max-tokens=512
quarkus.langchain4j.openai.chat-model.temperature=0.1

kafka.advisor.prompt.path=/deployments/config/prompt/system-prompt.txt

quarkus.http.port=8080
quarkus.application.name=kafka-advisor-agent
